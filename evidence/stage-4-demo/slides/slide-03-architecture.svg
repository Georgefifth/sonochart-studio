<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" rx="14" fill="#0B101B" stroke="#1E293B" stroke-width="2" />
  <!-- 4 Isometric Stack Plates -->
  <g transform="translate(80, 45)">
