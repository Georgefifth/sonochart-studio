    </text>
  </g>
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="640" height="86" rx="8" fill="#111827" stroke="#10B981" stroke-width="2.5" />
    <text x="24" y="34" fill="#10B981" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700">
